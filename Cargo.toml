[package]
name = "wireseer-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first network discovery, identity, and history for the terminal"
license = "MIT"
repository = "https://github.com/example/wireseer"
homepage = "https://github.com/example/wireseer"
documentation = "https://docs.rs/wireseer-tui"
readme = "README.md"
keywords = ["network", "tui", "discovery", "monitoring", "lan"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "wireseer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
csv = "1.3"
directories = "6.0"
futures = "0.3"
fuzzy-matcher = "0.3"
hickory-resolver = { version = "0.24", features = ["system-config", "tokio-runtime"] }
if-addrs = "0.13"
ipnet = { version = "2.11", features = ["serde"] }
parking_lot = "0.12"
quick-xml = { version = "0.39", features = ["serialize"] }
ratatui = { version = "0.29", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
insta = "1.42"
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
